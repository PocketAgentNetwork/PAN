[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pan-network-client"
version = "1.0.0"
description = "Official Python client for the Pocket Agent Network (PAN)"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["websockets>=12.0"]
keywords = ["pan", "agent", "network", "websocket"]

[project.urls]
Repository = "https://github.com/PocketAgentNetwork/PAN"

[tool.setuptools.packages.find]
where = ["."]
include = ["pan_client*"]
